<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Узнать IP</title>
    <!-- Подключаем связь с Телеграмом -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            /* Цвета будут подстраиваться под темную/светлую тему пользователя */
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        h1 {
            color: var(--tg-theme-button-color, #3390ec);
            font-size: 36px;
        }
    </style>
</head>
<body>
    <h2>Привет! Твой IP-адрес:</h2>
    <h1 id="ip-address">Ищем...</h1>

    <script>
        // Говорим Телеграму, что приложение загрузилось
        Telegram.WebApp.ready();

        // Бесплатный сервис, который просто возвращает IP того, кто к нему обратился
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                // Берем IP и вставляем его в заголовок h1 на странице
                document.getElementById('ip-address').innerText = data.ip;
            })
            .catch(error => {
                document.getElementById('ip-address').innerText = "Ошибка!";
            });
    </script>
</body>
</html>
